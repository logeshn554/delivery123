name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
      - run: node scripts/check-production-fixtures.mjs
      - run: npm audit --omit=dev --audit-level=high
  accounts:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: allgo_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: allgo_account_integration
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALLGO_ACCOUNT_TEST_PASSWORD: integration-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm install --prefix .cache/firebase-cli --no-save --package-lock=false firebase-tools@15.34.0
      - name: Verify SQL and Firebase account lifecycle
        run: npm run test:accounts
  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        audience: [customer, merchant, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: chmod +x android/gradlew
      - name: Build audience debug APK
        run: node scripts/build-app.mjs --audience=${{ matrix.audience }} --platform=android
      - run: node scripts/check-production-fixtures.mjs
      - name: Verify packaged identity and web metadata
        run: node scripts/check-app-artifact.mjs ${{ matrix.audience }}
      - uses: actions/upload-artifact@v7
        with:
          name: allgo-${{ matrix.audience }}-debug-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .cache/apps/${{ matrix.audience }}/app-debug.apk
            .cache/apps/${{ matrix.audience }}/verification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
